server {
    server_name biblioteki.jaboja.pl;

    location / {
        proxy_pass http://127.0.0.1:8292;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Obsługa WebSocket (jeśli używasz MCP)
    location /mcp {
        proxy_pass http://127.0.0.1:8292;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Błędy
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/biblioteki.jaboja.pl/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/biblioteki.jaboja.pl/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = biblioteki.jaboja.pl) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name biblioteki.jaboja.pl;
    return 404; # managed by Certbot

}