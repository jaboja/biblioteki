server {
    listen 80;
    server_name biblioteki.example.com;

    # Przekierowanie HTTP -> HTTPS (odkomentuj jeśli używasz SSL)
    # return 301 https://$server_name$request_uri;

    location / {
        proxy_pass http://localhost:8292;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Obsługa WebSocket (jeśli używasz MCP)
    location /mcp {
        proxy_pass http://localhost:8292;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Statyczne pliki (jeśli używasz frontend)
    location /static/ {
        alias /opt/biblioteki/static/;
        expires 30d;
    }

    # Błędy
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
