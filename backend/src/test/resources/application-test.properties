# Test database configuration
# PostgreSQL instance is provided by Zonky embedded-postgres (io.zonky.test) via
# @AutoConfigureEmbeddedDatabase on the test classes - the datasource URL is set
# automatically, so it must NOT be hardcoded here.

# Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true

# Disable Flyway and SQL initialization for tests
spring.flyway.enabled=false
