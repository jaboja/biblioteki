# JWT Configuration
jwt:
  secret: ${JWT_SECRET:default-secret-change-in-production-1234567890123456789012345678901234567890}
  expiration: 86400000  # 24 hours in milliseconds

spring:
  application:
    name: biblioteki

  datasource:
    url: jdbc:postgresql://localhost:5432/biblioteki
    username: biblioteki_user
    password: biblioteki123;

  h2:
    console:
      enabled: true          # dostępna pod /h2-console (tylko dev)
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update       # tworzy/aktualizuje schemat automatycznie
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  cache:
    type: caffeine
    caffeine:
      # TTL 10 minut – seria żądań w tym oknie trafia do cache
      spec: maximumSize=500,expireAfterWrite=10m

  ai:
    # MCP Server Configuration - HTTPS transport
    mcp:
      server:
        enabled: true
        protocol: STREAMABLE
        type: ASYNC
        streamable-http:
          mcp-endpoint: /mcp

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    disable-swagger-default-url: true

logging:
  level:
    pl.jaboja: DEBUG
    org.springframework.cache: TRACE   # usuń na produkcji
