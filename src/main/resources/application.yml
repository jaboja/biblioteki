spring:
  application:
    name: biblioteki

  datasource:
    url: jdbc:postgresql://localhost:5432/biblioteki
    username: biblioteki_user
    password: biblioteki123;

  h2:
    console:
      enabled: true          # dostępna pod /h2-console (tylko dev)
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update       # tworzy/aktualizuje schemat automatycznie
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  cache:
    type: caffeine
    caffeine:
      # TTL 10 minut – seria żądań w tym oknie trafia do cache
      spec: maximumSize=500,expireAfterWrite=10m

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    disable-swagger-default-url: true

logging:
  level:
    pl.jaboja: DEBUG
    org.springframework.cache: TRACE   # usuń na produkcji

# MCP Server Configuration - STDIO transport
spring:
  ai:
    mcp:
      server:
        stdio: true  # Enable STDIO transport for MCP server
