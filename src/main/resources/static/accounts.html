<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteki - Konta Dostępu</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Biblioteki - Konta Dostępu</h1>
        
        <div class="controls">
            <button onclick="loadAccounts()">Odśwież Listę Kont</button>
            <button onclick="showAddForm()">Dodaj Nowe Konto</button>
        </div>
        
        <div id="refreshTime" class="refresh-time"></div>
        
        <div id="errors" class="error-box" style="display: none;"></div>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalAccounts">0</div>
                <div class="stat-label">Wszystkie Konta</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="enabledAccounts">0</div>
                <div class="stat-label">Aktywne</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="disabledAccounts">0</div>
                <div class="stat-label">Nieaktywne</div>
            </div>
        </div>

        <!-- Formularz dodawania/edytowania konta -->
        <div id="accountForm" class="error-box" style="display: none; background-color: #f8f9fa; border: 1px solid #dee2e6;">
            <h3 id="formTitle">Dodaj Nowe Konto</h3>
            <form id="addAccountForm">
                <input type="hidden" id="accountId" />
                
                <div style="margin-bottom: 15px;">
                    <label for="librarySelect" style="display: block; margin-bottom: 5px; font-weight: 600;">Biblioteka:</label>
                    <select id="librarySelect" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;" required>
                        <option value="">Wybierz bibliotekę...</option>
                    </select>
                </div>
                
                <div style="margin-bottom: 15px;">
                    <label for="usernameInput" style="display: block; margin-bottom: 5px; font-weight: 600;">Nazwa użytkownika:</label>
                    <input type="text" id="usernameInput" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;" required />
                </div>
                
                <div style="margin-bottom: 15px;">
                    <label for="passwordInput" style="display: block; margin-bottom: 5px; font-weight: 600;">Hasło:</label>
                    <input type="password" id="passwordInput" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;" />
                </div>
                
                <div style="margin-bottom: 15px;">
                    <label style="display: flex; align-items: center;">
                        <input type="checkbox" id="enabledInput" style="margin-right: 10px;" checked />
                        <span style="font-weight: 600;">Konto aktywne</span>
                    </label>
                </div>
                
                <div style="display: flex; gap: 10px;">
                    <button type="button" onclick="saveAccount()" style="background-color: #27ae60;">Zapisz</button>
                    <button type="button" onclick="hideForm()" style="background-color: #95a5a6;">Anuluj</button>
                </div>
            </form>
        </div>

        <div class="loans-table">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Biblioteka</th>
                        <th>Nazwa użytkownika</th>
                        <th>Status</th>
                        <th>Akcje</th>
                    </tr>
                </thead>
                <tbody id="accountsTableBody">
                    <tr>
                        <td colspan="5" class="loading">Ładowanie kont...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let libraries = [];
        let currentEditId = null;

        async function loadAccounts() {
            try {
                // Ładuj biblioteke
                await loadLibraries();
                
                const response = await fetch('/api/accounts');
                if (!response.ok) {
                    throw new Error(`Błąd HTTP! status: ${response.status}`);
                }
                const data = await response.json();
                displayAccounts(data);
            } catch (error) {
                showError('Nie udało się załadować kont: ' + error.message);
            }
        }

        async function loadLibraries() {
            try {
                const response = await fetch('/api/accounts/libraries');
                if (!response.ok) {
                    throw new Error(`Błąd HTTP! status: ${response.status}`);
                }
                libraries = await response.json();
                updateLibrarySelect();
            } catch (error) {
                showError('Nie udało się załadować listy bibliotek: ' + error.message);
            }
        }

        function updateLibrarySelect() {
            const select = document.getElementById('librarySelect');
            select.innerHTML = '<option value="">Wybierz bibliotekę...</option>';
            libraries.forEach(lib => {
                const option = document.createElement('option');
                option.value = lib.id;
                option.textContent = lib.name || lib.id;
                select.appendChild(option);
            });
        }

        function displayAccounts(accounts) {
            // Aktualizuj czas odświeżenia
            const refreshTime = new Date().toLocaleString('pl-PL');
            document.getElementById('refreshTime').textContent = `Ostatnia aktualizacja: ${refreshTime}`;

            // Wyświetl błędy jeśli wystąpiły
            hideError();

            // Zapisz aktualne konta do użytku podczas edycji
            localStorage.setItem('currentAccounts', JSON.stringify(accounts));

            const tbody = document.getElementById('accountsTableBody');
            
            // Wyczyść istniejące wiersze
            tbody.innerHTML = '';
            
            if (accounts.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">Brak kont</td></tr>';
                updateStats(0, 0, 0);
                return;
            }

            // Oblicz statystyki
            let total = accounts.length;
            let enabled = accounts.filter(a => a.enabled).length;
            let disabled = total - enabled;

            updateStats(total, enabled, disabled);

            // Utwórz wiersze tabeli
            accounts.forEach(account => {
                const row = document.createElement('tr');
                
                let statusClass = 'renewable';
                let statusText = 'Aktywne';
                if (!account.enabled) {
                    statusClass = 'not-renewable';
                    statusText = 'Nieaktywne';
                }

                row.innerHTML = `
                    <td>${account.id || 'Brak'}</td>
                    <td>${account.libraryDisplayName || account.library || 'Brak'}</td>
                    <td>${account.username || 'Brak'}</td>
                    <td class="${statusClass}">${statusText}</td>
                    <td>
                        <button onclick="editAccount(${account.id})" style="padding: 5px 10px; margin-right: 5px; background-color: #3498db;" title="Edytuj">Edytuj</button>
                        <button onclick="deleteAccount(${account.id})" style="padding: 5px 10px; background-color: #e74c3c;" title="Usuń">Usuń</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function updateStats(total, enabled, disabled) {
            document.getElementById('totalAccounts').textContent = total;
            document.getElementById('enabledAccounts').textContent = enabled;
            document.getElementById('disabledAccounts').textContent = disabled;
        }

        function showAddForm() {
            currentEditId = null;
            document.getElementById('formTitle').textContent = 'Dodaj Nowe Konto';
            document.getElementById('accountId').value = '';
            document.getElementById('librarySelect').value = '';
            document.getElementById('usernameInput').value = '';
            document.getElementById('passwordInput').value = '';
            document.getElementById('enabledInput').checked = true;
            document.getElementById('accountForm').style.display = 'block';
        }

        function showEditForm(account) {
            currentEditId = account.id;
            document.getElementById('formTitle').textContent = 'Edytuj Konto';
            document.getElementById('accountId').value = account.id;
            document.getElementById('librarySelect').value = account.library;
            document.getElementById('usernameInput').value = account.username;
            document.getElementById('passwordInput').value = ''; // Don't show password
            document.getElementById('enabledInput').checked = account.enabled;
            document.getElementById('accountForm').style.display = 'block';
        }

        function hideForm() {
            document.getElementById('accountForm').style.display = 'none';
            currentEditId = null;
        }

        async function saveAccount() {
            const library = document.getElementById('librarySelect').value;
            const username = document.getElementById('usernameInput').value;
            const password = document.getElementById('passwordInput').value;
            const enabled = document.getElementById('enabledInput').checked;

            if (!library || !username) {
                showError('Proszę uzupełnić wszystkie wymagane pola');
                return;
            }

            try {
                const requestBody = { library, username, password, enabled };
                
                let response;
                if (currentEditId) {
                    response = await fetch(`/api/accounts/${currentEditId}`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(requestBody)
                    });
                } else {
                    response = await fetch('/api/accounts', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(requestBody)
                    });
                }

                if (!response.ok) {
                    throw new Error(`Błąd HTTP! status: ${response.status}`);
                }

                hideForm();
                loadAccounts();
                
            } catch (error) {
                showError('Nie udało się zapisać konta: ' + error.message);
            }
        }

        async function deleteAccount(id) {
            if (!confirm('Czy na pewno chcesz usunąć to konto?')) {
                return;
            }

            try {
                const response = await fetch(`/api/accounts/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error(`Błąd HTTP! status: ${response.status}`);
                }

                loadAccounts();
                
            } catch (error) {
                showError('Nie udało się usunąć konta: ' + error.message);
            }
        }

        function editAccount(id) {
            // Find the account in the current data
            const accounts = JSON.parse(localStorage.getItem('currentAccounts') || '[]');
            const account = accounts.find(a => a.id === id);
            if (account) {
                showEditForm(account);
            } else {
                showError('Nie znaleziono konta do edycji');
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('errors');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function hideError() {
            const errorDiv = document.getElementById('errors');
            errorDiv.style.display = 'none';
        }

        // Załaduj konta przy ładowaniu strony
        window.addEventListener('DOMContentLoaded', loadAccounts);
    </script>
</body>
</html>
